services:

  app:
    image: student-management-system:2.0
    build: .
    container_name: student-app
    ports:
      - "8082:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/myDB
      DB_USERNAME: postgres
      DB_PASSWORD: 1234
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: student-postgres
    environment:
      POSTGRES_DB: myDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d myDB" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: